# L3-001 — CI PR tối thiểu (spec §11.6, §8, Q18).
# lint → typecheck → unit test → build → kiểm bundle ("0 chunk 3D trước Enter World" + ngân sách tải).
# Không secret, không quyền cloud, chỉ đọc repo.
name: PR checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: lint · typecheck · test · build · check-bundle · leaks · licenses
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.16.1

      - name: Setup Node.js 24 LTS
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build (static export)
        run: pnpm build

      - name: Check bundle (no 3D before Enter World, §8 budgets)
        run: node tools/check-bundle/index.mjs out

      # L3-002 — §4.6 quét rò rỉ (luật riêng R1–R6) trên nội dung nguồn + artifact build.
      # R5 (denylist) bỏ qua kèm cảnh báo vì CI không có TQA_DENYLIST_FILE (danh sách thật không nằm trong repo public).
      - name: Scan leaks (§4.6 custom rules)
        run: node tools/scan-leaks/index.mjs src/content out

      # §4.6 gitleaks: ruleset mặc định + .gitleaks.toml, quét thư mục (không quét lịch sử git).
      # Image ghim phiên bản; nên ghim thêm digest (@sha256:…) sau khi Lead xác minh.
      - name: Gitleaks (pinned v8.28.0) on out/ and src/content/
        env:
          GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.28.0
        run: |
          for target in out src/content; do
            docker run --rm --network none -v "$GITHUB_WORKSPACE:/repo:ro" "$GITLEAKS_IMAGE" \
              dir "/repo/$target" --config /repo/.gitleaks.toml --redact --no-banner --exit-code 1
          done

      # L3-002 — §7.3 mỗi file trong public/ phải có dòng trong assets/LICENSES.csv.
      - name: Check asset licenses (§7.3)
        run: node tools/check-licenses/index.mjs
