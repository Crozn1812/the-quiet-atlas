# L3-001 — CI PR tối thiểu (spec §11.6, §8, Q18).
# lint → typecheck → unit test → build → kiểm bundle ("0 chunk 3D trước Enter World" + ngân sách tải).
# Không secret, không quyền cloud, chỉ đọc repo.
name: PR checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: lint · typecheck · test · build · check-bundle · leaks · licenses · e2e · perf
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false
          # Toàn bộ lịch sử cho gitleaks git (L3-003).
          fetch-depth: 0

      # L5-010: v6 chạy trên Node 24 (v4 chạy Node 20 → cảnh báo "Node.js 20 is deprecated" ở run #1).
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.16.1

      - name: Setup Node.js 24 LTS
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build (static export)
        run: pnpm build

      - name: Check bundle (no 3D before Enter World, §8 budgets)
        run: node tools/check-bundle/index.mjs out

      # L3-002 — §4.6 quét rò rỉ (luật riêng R1–R6) trên nội dung nguồn + artifact build.
      # R5 (denylist) bỏ qua kèm cảnh báo vì CI không có TQA_DENYLIST_FILE (danh sách thật không nằm trong repo public).
      - name: Scan leaks (§4.6 custom rules)
        run: node tools/scan-leaks/index.mjs src/content out

      # §4.6 gitleaks: ruleset mặc định + .gitleaks.toml.
      # L3-003: image ghim theo digest (OCI index của tag v8.28.0, đọc từ ghcr.io ngày 2026-11-04);
      # quét `dir` trên out/ và src/content/, và `git` trên toàn bộ lịch sử (checkout fetch-depth: 0).
      # Container không có mạng, repo mount read-only.
      - name: Gitleaks (v8.28.0, pinned by digest) on out/, src/content/ and full git history
        env:
          GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.28.0@sha256:cdbb7c955abce02001a9f6c9f602fb195b7fadc1e812065883f695d1eeaba854
        run: |
          docker pull "$GITLEAKS_IMAGE"
          for target in out src/content; do
            docker run --rm --network none -v "$GITHUB_WORKSPACE:/repo:ro" "$GITLEAKS_IMAGE" \
              dir "/repo/$target" --config /repo/.gitleaks.toml --redact --no-banner --exit-code 1
          done
          # safe.directory: repo thuộc uid của runner, container chạy uid khác.
          docker run --rm --network none -v "$GITHUB_WORKSPACE:/repo:ro" \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0='*' \
            "$GITLEAKS_IMAGE" \
            git /repo --config /repo/.gitleaks.toml --redact --no-banner --exit-code 1

      # L3-002 — §7.3 mỗi file trong public/ phải có dòng trong assets/LICENSES.csv.
      - name: Check asset licenses (§7.3)
        run: node tools/check-licenses/index.mjs

      # L3-003 — Playwright e2e trên out/ (T01, T02, Q12, T11 HTML + axe, Enter World).
      # CI dùng Chromium bundled (playwright.config.ts: CI=true → không đặt channel); local dùng msedge.
      # GitHub Actions luôn đặt CI=true; không đặt PLAYWRIGHT_CHANNEL ở đây (ubuntu-24.04 không có Edge).
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E (Playwright + axe-core)
        run: pnpm exec playwright test

      # L3-004 — §8 / Q18 cold-cache load budget: 3 cold loads, CDP 10 Mbps / RTT 100 ms, gzip like CloudFront,
      # gate on the worst run. Runner = bundled Chromium + SwiftShader, NOT the ADR 0007 reference machine:
      # byte gates are machine-independent; time-to-playable here is a regression signal, not the T08 result.
      - name: Load budget trace (§8, Q18)
        run: pnpm exec playwright test -c tests/perf/playwright.perf.config.ts

      # L3-004 — Lighthouse CI (§8 Quick web UX, lab): LCP ≤ 2.5 s, CLS ≤ 0.1, TBT ≤ 200 ms as lab proxy for INP;
      # accessibility score recorded only. Uses the runner's preinstalled Chrome. Reports go to the
      # filesystem (test-results/lhci) and are uploaded as a workflow artifact only — no public storage.
      # L5-010: chỉ rõ Chrome cài sẵn của runner cho lhci (chrome-launcher đọc CHROME_PATH); thiếu thì fail rõ ràng
      # thay vì lỗi "No Chrome installations found" ở giữa lhci.
      - name: Resolve runner Chrome for Lighthouse
        run: |
          chrome="$(command -v google-chrome-stable || command -v google-chrome || true)"
          if [ -z "$chrome" ]; then echo "::error::Google Chrome not found on runner (needed by lhci)"; exit 1; fi
          "$chrome" --version
          echo "CHROME_PATH=$chrome" >> "$GITHUB_ENV"

      - name: Lighthouse CI (filesystem reports only)
        run: pnpm exec lhci autorun

      # Đợt 11: log job cần đăng nhập — đưa từng assertion lỗi + số đo ra annotation (đọc công khai được).
      # ADR 0011: gate theo trung vị 5 lần, nên bước này chạy MỌI lần để lần xấu nhất luôn hiện ra.
      - name: Lighthouse assertion summary (annotations)
        if: ${{ !cancelled() }}
        run: |
          node -e '
          const fs = require("fs");
          const p = ".lighthouseci/assertion-results.json";
          if (!fs.existsSync(p)) { console.log("::warning title=lhci::no assertion-results.json"); process.exit(0); }
          for (const a of JSON.parse(fs.readFileSync(p, "utf8"))) {
            if (a.passed) continue;
            const url = (a.url || "").replace(/^https?:\/\/[^/]+/, "");
            console.log(`::error title=lhci ${a.auditId}::${url} ${a.auditProperty || ""} ${a.operator} ${a.expected}, found ${Math.round(a.actual * 1000) / 1000} (values ${(a.values || []).map(v => Math.round(v)).join("/")})`);
          }
          for (const f of fs.readdirSync(".lighthouseci").filter(f => f.startsWith("lhr-") && f.endsWith(".json"))) {
            const r = JSON.parse(fs.readFileSync(".lighthouseci/" + f, "utf8")); const a = r.audits;
            const url = r.finalDisplayedUrl.replace(/^https?:\/\/[^/]+/, "");
            const tbt = Math.round(a["total-blocking-time"].numericValue), lcp = Math.round(a["largest-contentful-paint"].numericValue), cls = a["cumulative-layout-shift"].numericValue;
            const over = tbt > 200 || lcp > 2500 || cls > 0.1;
            console.log(`::${over ? "warning" : "notice"} title=lhci run${over ? " (vượt ngưỡng ở lần này)" : ""}::${url} TBT ${tbt} LCP ${lcp} CLS ${cls.toFixed(3)} bootup ${Math.round(a["bootup-time"].numericValue)} benchmarkIndex ${r.environment.benchmarkIndex}`);
          }'

      - name: Upload perf reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: perf-reports
          path: |
            test-results/load-budget/
            test-results/lhci/
            .lighthouseci/
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore

  # L5-012 — §11.6 "nếu infra/ đổi: fmt, validate". KHÔNG plan/apply, KHÔNG id-token, KHÔNG credential AWS:
  # chỉ `terraform fmt -check`, `init -backend=false`, `validate` qua tools/checks/terraform.mjs.
  # tflint, Checkov/Trivy, plan: DEFERRED (docs/runbook/terraform.md).
  # Action ghim theo commit SHA đầy đủ (tra bằng `git ls-remote` ngày 2026-11-04).
  terraform:
    name: terraform fmt · validate (infra/)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Detect infra changes
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then base="$PR_BASE_SHA"; else base="$PUSH_BEFORE_SHA"; fi
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            echo "Không xác định được commit gốc — chạy kiểm Terraform."
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$base" HEAD | grep -E '^(infra/|tools/checks/terraform\.mjs$|\.github/workflows/pr\.yml$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Không có thay đổi infra/ — bỏ qua kiểm Terraform."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js 24 LTS
        if: steps.changes.outputs.run == 'true'
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24

      - name: Setup Terraform 1.16.6
        if: steps.changes.outputs.run == 'true'
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.6
          terraform_wrapper: false

      - name: Terraform fmt · init -backend=false · validate
        if: steps.changes.outputs.run == 'true'
        run: node tools/checks/terraform.mjs
